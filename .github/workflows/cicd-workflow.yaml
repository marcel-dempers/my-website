# This is a basic workflow to help you get started with Actions

name: CICD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the $default-branch branch
  push:
    branches: [ main, chapter-06 ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: [self-hosted, Linux]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
######################################################################
      - uses: actions/checkout@v4
        name: get code

      - name: build & tag image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/my-website"
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-6)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build . -t $IMAGE_NAME:$IMAGE_TAG

      - name: publish image
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE_NAME:$IMAGE_TAG
######################################################################
      - name: deploy package
        run: |
          . infra/scripts/deploy.sh $IMAGE_NAME $IMAGE_TAG

      - name: configure
        run: |
          . infra/scripts/configure.sh $IMAGE_NAME $IMAGE_TAG

      - name: make live
        run: |
          . infra/scripts/live.sh $IMAGE_NAME $IMAGE_TAG
######################################################################
